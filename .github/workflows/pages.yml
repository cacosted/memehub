# Cada push a main: crea miniaturas y entradas para memes nuevos y publica la página.
name: Publicar Memeteca

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Miniaturas y catálogo de memes nuevos
        run: node tools/build.mjs

      - name: Guardar lo generado en el repo
        run: |
          if [ -n "$(git status --porcelain thumbs data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add thumbs data
            git commit -m "Miniaturas y catálogo de memes nuevos"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
